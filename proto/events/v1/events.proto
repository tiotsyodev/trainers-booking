syntax = "proto3";

package events1;

option go_package = "booker/gen/events/v1;events.v1";

import "google/protobuf/timestamp.proto";

message Event {
    string event_id = 1;
    google.protobuf.Timestamp occurred_at = 2;

    oneof payload {
      SlotBooked slot_booked = 10;
    }
}

message SlotBooked {
    string slot_id = 1;
    string trainer_id = 2;
    string client_id = 3;
    google.protobuf.Timestamp start_time = 4;
    google.protobuf.Timestamp end_time = 5;
}